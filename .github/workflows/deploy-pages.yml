name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # enablement: true provisions the Pages site on the first run (build
      # type: workflow) — no manual Settings → Pages step required.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # src/ is the committed, pre-built static site — no build step needed.
      # Regenerating it here would require the taxonomy data only, which is
      # already in the repo; keeping the committed artifact makes deploys
      # reproducible without a Node setup step.
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: src

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
